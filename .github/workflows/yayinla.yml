name: Yayınla

# Üretilmiş HTML repoya commit'lenmez: site her seferinde kaynaklardan (portfolyo.json, yazilar/,
# generator/) baştan üretilir. Üretici hata verirse (yapılandırma hatası, sızıntı bulgusu) iş
# kırmızı biter ve yayın yapılmaz; eski site yerinde kalır.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # haftalık: Pazartesi 06:17 UTC (repo istatistikleri tazelenir)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Üretici testleri (kırmızıysa yayın yapılmaz)
        env:
          PYTHONPATH: generator
        run: |
          pip install pytest
          python -m pytest generator/tests -q
      - name: Siteyi üret (GitHub API + yazılar + paylaşım görselleri, sızıntı denetimi dahil)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: generator
        # --siki: bir repo için veri alınamazsa (adı değişti, özel yapıldı, API hatası) iş kırmızı biter, eski site kalır.
        run: python -m portfolyo uret portfolyo.json --api --siki --og-gorsel --yazilar yazilar --cikti _site
      - name: Paylaşım görseli kontrolü
        run: |
          if [ ! -f _site/og/site.png ]; then echo "::warning::og/site.png üretilemedi (Chrome yok mu?); site görselsiz yayınlanacak"; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
